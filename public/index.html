<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcon OCR — Test Arayüzü</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Arcon OCR</h1>
    <span id="status-badge" class="badge">kontrol ediliyor…</span>
    <nav class="header-nav">
      <a href="/docs.html">API Dokümantasyonu</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <div id="dropzone" class="dropzone">
        <p><strong>Dosyayı buraya sürükleyin</strong> ya da seçin</p>
        <p class="hint">Görsel, PDF, DOCX, PPTX, TXT/CSV/JSON — her tür dosya kabul edilir</p>
        <input id="file-input" type="file" hidden />
        <button id="pick-btn" type="button">Dosya seç</button>
        <p id="file-name" class="file-name"></p>
      </div>

      <div class="or-divider">veya URL ile</div>
      <input id="url-input" type="url" placeholder="https://.../belge.pdf" />

      <div class="controls auth-row">
        <label for="api-token-input">API Token</label>
        <input id="api-token-input" type="password" autocomplete="off" placeholder="Authorization Bearer token" />
      </div>

      <div class="controls">
        <label for="provider-select">Motor</label>
        <select id="provider-select">
          <option value="auto">Otomatik (önerilen)</option>
          <option value="mistral">Mistral OCR</option>
          <option value="tesseract">Tesseract (yerel, sadece görsel)</option>
        </select>
        <button id="submit-btn" type="button">OCR Çalıştır</button>
      </div>

      <details class="advanced">
        <summary>Gelişmiş seçenekler</summary>
        <div class="advanced-body">
          <label for="profile-select">Çıkarım profili</label>
          <select id="profile-select">
            <option value="jde_invoice" selected>JDE Fatura (varsayılan)</option>
            <option value="none">Yok — ham OCR zarfı</option>
          </select>

          <label class="checkbox-row">
            <input id="structured-only-input" type="checkbox" checked />
            Yalnızca JDE JSON döndür (varsayılan). Kapatırsan tam OCR zarfı gelir.
          </label>

          <label for="pages-input">Sayfalar <span class="hint">(ör. 0,1,2 — boş bırakılırsa tümü, 0-indeksli)</span></label>
          <input id="pages-input" type="text" placeholder="0,1,2" />

          <label class="checkbox-row">
            <input id="include-images-input" type="checkbox" />
            Sayfa içi görselleri de çıkar (base64)
          </label>

          <label for="schema-name-input">Yapılandırılmış çıktı adı <span class="hint">(opsiyonel — profil yoksa)</span></label>
          <input id="schema-name-input" type="text" placeholder="document_extraction" />

          <label for="schema-input">Yapılandırılmış çıktı JSON Schema <span class="hint">(opsiyonel — profil seçiliyse gerekmez)</span></label>
          <textarea id="schema-input" rows="4" placeholder='{"type":"object","properties":{"invoice_no":{"type":"string"}}}'></textarea>
        </div>
      </details>
    </section>

    <section class="panel result-panel">
      <div id="empty-state" class="empty-state">Sonuç burada görünecek.</div>
      <div id="loading" class="loading" hidden>İşleniyor…</div>

      <div id="result" hidden>
        <div class="meta-row">
          <span id="meta-provider" class="tag"></span>
          <span id="meta-type" class="tag"></span>
          <span id="meta-pages" class="tag"></span>
          <span id="meta-duration" class="tag"></span>
        </div>
        <div id="warnings" class="warnings"></div>

        <div id="page-nav" class="page-nav" hidden>
          <button id="page-prev" type="button">‹</button>
          <select id="page-select"></select>
          <button id="page-next" type="button">›</button>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="render">Görüntüle</button>
          <button class="tab-btn" data-tab="text">Metin</button>
          <button class="tab-btn" data-tab="markdown">Markdown</button>
          <button class="tab-btn" data-tab="tables">Tablolar</button>
          <button class="tab-btn" data-tab="images">Görseller</button>
          <button class="tab-btn" data-tab="annotation">Belge Özeti</button>
          <button class="tab-btn" data-tab="json">Ham JSON</button>
        </div>

        <div class="tab-toolbar">
          <button id="copy-btn" type="button" class="ghost-btn">Kopyala</button>
          <button id="download-txt" type="button" class="ghost-btn">.txt indir</button>
          <button id="download-md" type="button" class="ghost-btn">.md indir</button>
          <button id="download-json" type="button" class="ghost-btn">.json indir</button>
        </div>

        <div id="tab-render" class="tab-content active rendered"></div>
        <pre id="tab-text" class="tab-content"></pre>
        <pre id="tab-markdown" class="tab-content"></pre>
        <div id="tab-tables" class="tab-content rendered"></div>
        <div id="tab-images" class="tab-content rendered"></div>
        <pre id="tab-annotation" class="tab-content"></pre>
        <pre id="tab-json" class="tab-content"></pre>
      </div>

      <div id="error-box" class="error-box" hidden></div>
    </section>
  </main>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/dompurify.js"></script>
  <script src="app.js"></script>
</body>
</html>
